document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    const blobUrls = {};
    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        blobUrls[uuid] = URL.createObjectURL(new Blob([finalBytes], { type: entry.mime }));
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        blobUrls[uuid] = URL.createObjectURL(new Blob([], { type: entry.mime }));
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    setStatus('Rendering...');
    for (const uuid of uuids) template = template.split(uuid).join(blobUrls[uuid]);

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).split('</' + 'script>').join('<\\/' + 'script>') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);
    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: fetch and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const r = await fetch(s.src);
        s.textContent = await r.text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

op-filter:blur(12px); position:sticky; top:0; z-index:10; flex-wrap:wrap\">\n    <div style=\"display:flex; align-items:center; gap:10px; flex:1; min-width:0\">\n      <div style=\"width:32px; height:32px; background:linear-gradient(135deg,#1e3a5f 0%,#2563eb 100%); border-radius:8px; display:flex; align-items:center; justify-content:center; flex-shrink:0\">\n        <svg width=\"16\" height=\"16\" viewBox=\"0 0 16 16\" fill=\"none\">\n          <rect x=\"1\" y=\"1\" width=\"6\" height=\"6\" rx=\"1.5\" fill=\"white\"><\u002Frect>\n          <rect x=\"9\" y=\"1\" width=\"6\" height=\"6\" rx=\"1.5\" fill=\"white\" opacity=\"0.55\"><\u002Frect>\n          <rect x=\"1\" y=\"9\" width=\"6\" height=\"6\" rx=\"1.5\" fill=\"white\" opacity=\"0.55\"><\u002Frect>\n          <rect x=\"9\" y=\"9\" width=\"6\" height=\"6\" rx=\"1.5\" fill=\"white\" opacity=\"0.3\"><\u002Frect>\n        <\u002Fsvg>\n      <\u002Fdiv>\n      <div>\n        <div style=\"font-size:15px; font-weight:700; color:#e2e8f0; letter-spacing:-0.3px; line-height:1.2\">IT StoreOps<\u002Fdiv>\n        <div style=\"font-size:10px; color:#2a3f5f; letter-spacing:1px; text-transform:uppercase; margin-top:1px\">Equipment Inventory<\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n    <div style=\"display:flex; gap:2px; background:#0b1525; border:1px solid #111d33; border-radius:8px; padding:3px\">\n      <button onclick=\"{{ setInventory }}\" style=\"padding:6px 14px; border-radius:5px; border:none; font-family:inherit; font-size:13px; font-weight:500; cursor:pointer; background:{{ invBg }}; color:{{ invColor }}; transition:background 0.15s,color 0.15s\">Inventory<\u002Fbutton>\n      <button onclick=\"{{ setShopping }}\" style=\"padding:6px 14px; border-radius:5px; border:none; font-family:inherit; font-size:13px; font-weight:500; cursor:pointer; background:{{ shopBg }}; color:{{ shopColor }}; transition:background 0.15s,color 0.15s; display:flex; align-items:center; gap:6px\">Shopping<span style=\"font-family:'JetBrains Mono',monospace; font-size:10px; background:{{ badgeBg }}; color:{{ badgeColor }}; padding:1px 6px; border-radius:10px; font-weight:600\">{{ shoppingCount }}<\u002Fspan><\u002Fbutton>\n    <\u002Fdiv>\n    <button onclick=\"{{ openAdd }}\" style=\"padding:8px 18px; background:#2563eb; color:#fff; border:none; border-radius:8px; font-family:inherit; font-size:13px; font-weight:600; cursor:pointer; flex-shrink:0; white-space:nowrap\">+ Add Item<\u002Fbutton>\n  <\u002Fheader>\n\n  <!-- LOADING -->\n  <sc-if value=\"{{ isLoading }}\" hint-placeholder-val=\"{{ false }}\">\n    <div style=\"position:fixed; inset:0; background:rgba(7,14,28,0.85); display:flex; align-items:center; justify-content:center; z-index:300; backdrop-filter:blur(8px)\">\n      <div style=\"text-align:center\">\n        <div style=\"width:36px; height:36px; border:3px solid #1a2d4a; border-top-color:#2563eb; border-radius:50%; margin:0 auto 14px; animation:spin 0.8s linear infinite\"><\u002Fdiv>\n        <div style=\"font-size:13px; color:#2a3f5f; letter-spacing:0.5px\">{{ loadingMsg }}<\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsc-if>\n\n  <!-- STATS -->\n  <div style=\"display:flex; gap:10px; padding:20px 24px 4px; flex-wrap:wrap\">\n    <div onclick=\"{{ statAllClick }}\" style=\"flex:1; min-width:100px; padding:14px 16px; background:#0b1525; border:1px solid {{ statAllBorder }}; border-radius:10px; cursor:pointer; transition:border-color 0.15s\">\n      <div style=\"font-family:'JetBrains Mono',monospace; font-size:28px; font-weight:600; color:#e2e8f0; line-height:1\">{{ totalCount }}<\u002Fdiv>\n      <div style=\"font-size:11px; color:#2a3f5f; margin-top:4px; text-transform:uppercase; letter-spacing:0.6px\">Items Tracked<\u002Fdiv>\n    <\u002Fdiv>\n    <div onclick=\"{{ statLowClick }}\" style=\"flex:1; min-width:100px; padding:14px 16px; background:{{ alertBg }}; border:1px solid {{ alertBorder }}; border-radius:10px; cursor:pointer; transition:border-color 0.15s\">\n      <div style=\"font-family:'JetBrains Mono',monospace; font-size:28px; font-weight:600; color:{{ alertColor }}; line-height:1\">{{ lowCount }}<\u002Fdiv>\n      <div style=\"font-size:11px; color:#2a3f5f; margin-top:4px; text-transform:uppercase; letter-spacing:0.6px\">Low / Out of Stock<\u002Fdiv>\n    <\u002Fdiv>\n    <div onclick=\"{{ statOrderClick }}\" style=\"flex:1; min-width:100px; padding:14px 16px; background:#0b1525; border:1px solid {{ statOrderBorder }}; border-radius:10px; cursor:pointer; transition:border-color 0.15s\">\n      <div style=\"font-family:'JetBrains Mono',monospace; font-size:28px; font-weight:600; color:#60a5fa; line-height:1\">{{ onOrderTotal }}<\u002Fdiv>\n      <div style=\"font-size:11px; color:#2a3f5f; margin-top:4px; text-transform:uppercase; letter-spacing:0.6px\">On Order<\u002Fdiv>\n    <\u002Fdiv>\n    <div style=\"flex:1; min-width:100px; padding:14px 16px; background:#0b1525; border:1px solid #111d33; border-radius:10px\">\n      <div style=\"font-family:'JetBrains Mono',monospace; font-size:28px; font-weight:600; color:#f59e0b; line-height:1\">{{ shoppingCount }}<\u002Fdiv>\n      <div style=\"font-size:11px; color:#2a3f5f; margin-top:4px; text-transform:uppercase; letter-spacing:0.6px\">Shopping List<\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n\n  <!-- INVENTORY VIEW -->\n  <sc-if value=\"{{ isInventory }}\" hint-placeholder-val=\"{{ true }}\">\n    <div data-screen-label=\"Inventory\">\n      <div style=\"display:flex; gap:6px; padding:16px 24px 14px; flex-wrap:wrap; align-items:center\">\n        <sc-for list=\"{{ categoryChips }}\" as=\"chip\" hint-placeholder-count=\"6\">\n          <button onclick=\"{{ chip.onClick }}\" style=\"padding:5px 13px; border-radius:20px; border:1px solid {{ chip.border }}; background:{{ chip.bg }}; color:{{ chip.color }}; font-family:inherit; font-size:12px; font-weight:500; cursor:pointer; transition:all 0.12s\">{{ chip.label }}<\u002Fbutton>\n        <\u002Fsc-for>\n        <button onclick= v style=\"display:grid; grid-template-columns:1fr 1fr; gap:6px; margin-bottom:10px\">\n\n              <!-- Storage -->\n              <div style=\"background:#070e1c; border:1px solid #111d33; border-radius:8px; padding:8px 10px\">\n                <div style=\"font-size:9px; color:#2a3f5f; text-transform:uppercase; letter-spacing:0.7px; margin-bottom:5px\">Storage<\u002Fdiv>\n                <div style=\"display:flex; align-items:center; gap:3px\">\n                  <button onclick=\"{{ item.onStorSub }}\" style=\"width:22px; height:22px; border-radius:5px; border:1px solid #1a2d4a; background:transparent; color:#3a5070; font-size:14px; line-height:1; cursor:pointer; display:flex; align-items:center; justify-content:center; flex-shrink:0\">−<\u002Fbutton>\n                  <span style=\"font-family:'JetBrains Mono',monospace; font-size:18px; font-weight:600; color:#e2e8f0; flex:1; text-align:center\">{{ item.inStorage }}<\u002Fspan>\n                  <button onclick=\"{{ item.onStorAdd }}\" style=\"width:22px; height:22px; border-radius:5px; border:1px solid #1a2d4a; background:transparent; color:#3a5070; font-size:14px; line-height:1; cursor:pointer; display:flex; align-items:center; justify-content:center; flex-shrink:0\">+<\u002Fbutton>\n                <\u002Fdiv>\n              <\u002Fdiv>\n\n              <!-- On Order -->\n              <div style=\"background:rgba(37,99,235,0.07); border:1px solid rgba(37,99,235,0.18); border-radius:8px; padding:8px 10px\">\n                <div style=\"font-size:9px; color:#2a508a; text-transform:uppercase; letter-spacing:0.7px; margin-bottom:5px\">On Order<\u002Fdiv>\n                <div style=\"display:flex; align-items:center; gap:3px\">\n                  <button onclick=\"{{ item.onOrdSub }}\" style=\"width:22px; height:22px; border-radius:5px; border:1px solid rgba(37,99,235,0.25); background:transparent; color:#2a508a; font-size:14px; line-height:1; cursor:pointer; display:flex; align-items:center; justify-cont border:1px solid {{ item.spareBorder }}; border-radius:8px; padding:8px 10px\">\n                <div style=\"display:flex; justify-content:space-between; align-items:center; margin-bottom:4px\">\n                  <span style=\"font-size:9px; color:#2a3f5f; text-transform:uppercase; letter-spacing:0.7px\">Spare<\u002Fspan>\n                  <span style=\"font-size:8px; font-weight:700; color:{{ item.statusColor }}; letter-spacing:1.2px\">{{ item.statusLabel }}<\u002Fspan>\n                <\u002Fdiv>\n                <div style=\"font-family:'JetBrains Mono',monospace; font-size:26px; font-weight:700; color:{{ item.statusColor }}; line-height:1\">{{ item.spare }}<\u002Fdiv>\n              <\u002Fdiv>\n\n            <\u002Fdiv>\n\n            <!-- Stock bar -->\n            <div style=\"height:3px; background:#111d33; border-radius:2px; margin-bottom:5px; overflow:hidden\">\n              <div style=\"height:100%; border-radius:2px; background:{{ item.statusColor }}; width:{{ item.fillPct }}; transition:width 0.3s ease\"><\u002Fdiv>\n            <\u002Fdiv>\n            <div style=\"font-size:11px; color:#2a3f5f; margin-bottom:12px\">Min spare: {{ item.minStock }} {{ item.unit }}<\u002Fdiv>\n\n            <!-- Actions -->\n            <div style=\"display:flex; gap:5px\">\n              <button onclick=\"{{ item.onToggleBuy }}\" style=\"flex:1; padding:5px 8px; border-radius:6px; border:1px solid {{ item.buyBorder }}; background:{{ item.buyBg }}; color:{{ item.buyColor }}; font-family:inherit; font-size:11px; font-weight:500; cursor:pointer; transition:all 0.15s\">{{ item.buyLabel }}<\u002Fbutton>\n              <button onclick=\"{{ item.onEdit }}\" style=\"padding:5px 11px; border-radius:6px; border:1px solid #111d33; background:transparent; color:#2a3f5f; font-family:inherit; font-size:11px; cursor:pointer; transition:color 0.12s\" style-hover=\"color:#60a5fa\">Edit<\u002Fbutton>\n              <button onclick=\"{{ item.onDelete }}\" style=\"padding:5px 11px; bor rsor:pointer\">Cancel<\u002Fbutton>\n            <button onclick=\"{{ saveItem }}\" style=\"flex:2; padding:10px; border-radius:8px; border:none; background:#2563eb; color:#fff; font-family:inherit; font-size:14px; font-weight:600; cursor:pointer\">Save Item<\u002Fbutton>\n          <\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsc-if>\n\n<\u002Fdiv>\n<\u002Fx-dc>\n<script type=\"text/x-dc\" data-dc-script=\"\" data-props=\"{&quot;$preview&quot;: {&quot;width&quot;: 1280, &quot;height&quot;: 860}}\">\nclass Component extends DCLogic {\n  _sb = null;\n  _DEFAULTS = [\n    { id: 1,  name: 'Laptop',           category: 'Devices',     inStorage: 17, onOrder: 0,  waitingDeploy: 6, minStock: 3, unit: 'units', needToBuy: false },\n    { id: 2,  name: 'Travel Laptop',    category: 'Devices',     inStorage: 4,  onOrder: 0,  waitingDeploy: 0, minStock: 1, unit: 'units', needToBuy: false },\n    { id: 3,  name: 'Phones',           category: 'Devices',     inStorage: 10, onOrder: 0,  waitingDeploy: 6, minStock: 3, unit: 'units', needToBuy: false },\n    { id: 4,  name: 'DP Cables',        category: 'Cables',      inStorage: 1,  onOrder: 20, waitingDeploy: 8, minStock: 5, unit: 'units', needToBuy: false },\n    { id: 5,  name: 'Docks',            category: 'Docks',       inStorage: 5,  onOrder: 0,  waitingDeploy: 4, minStock: 2, unit: 'units', needToBuy: false },\n    { id: 6,  name: 'Monitor Arms',     category: 'Displays',    inStorage: 0,  onOrder: 5,  waitingDeploy: 5, minStock: 2, unit: 'units', needToBuy: false },\n    { id: 7,  name: 'Mice + Keyboards', category: 'Peripherals', inStorage: 1,  onOrder: 10, waitingDeploy: 5, minStock: 3, unit: 'units', needToBuy: false },\n    { id: 8,  name: '27\" Monitor',      category: 'Displays',    inStorage: 0,  onOrder: 0,  waitingDeploy: 0, minStock: 2, unit: 'units', needToBuy: false },\n    { id: 9,  name: '24\" Monitor',      category: 'Displays',    inStorage: 10, onOrder: 0,  waitingDeploy: 8, minStock: 2, unit: 'units', needToBuy: false },\n    { id: 10, name: 'Webcams',          category: 'Peripherals', inStorage: 0,  onOrder: 3,  waitingDeploy: 2, minStock: 2, unit: 'units', needToBuy: false },\n    { id: 11, name: 'Headphones',       category: 'Peripherals', inStorage: 2,  onOrder: 0,  waitingDeploy: 1, minStock: 2, unit: 'units', needToBuy: false },\n  ];\n\n  state = {\n    items: [],\n    view: 'inventory',\n    filter: 'All',\n    statFilter: 'all',\n    showModal: false,\n    editId: null,\n    form: { name: '', category: 'Devices', inStorage: 0, onOrder: 0, waitingDeploy: 0, minStock: 2, unit: 'units' },\n    categories: ['Devices', 'Cables', 'Docks', 'Displays', 'Peripherals'],\n    showCatModal: false,\n    newCatName: '',\n    dragId: null,\n    dragOverId: null,\n    loading: true,\n    loadingMsg: 'Loading inventory…',\n  };\n\n  _toDb(i, idx) {\n    return {\n      id: i.id,\n      name: i.name,\n      category: i.category,\n      in_storage: i.inStorage || 0,\n      on_order: i.onOrder || 0,\n      waiting_deploy: i.waitingDeploy || 0,\n      min_stock: i.minStock || 2,\n      unit: i.unit || 'units',\n      need_to_buy: i.needToBuy || false,\n      sort_order: idx != null ? idx : 0,\n    };\n  }\n\n  _fromDb(r) {\n    return {\n      id: r.id,\n      name: r.name,\n      category: r.category,\n      inStorage: r.in_storage,\n      onOrder: r.on_order,\n      waitingDeploy: r.waiting_deploy,\n      minStock: r.min_stock,\n      unit: r.unit,\n      needToBuy: r.need_to_buy,\n    };\n  }\n\n  async componentDidMount() {\n    const { createClient } = window.supabase;\n    this._sb = createClient(\n      'https://nxponkbkgpjzaxavanup.supabase.co',\n      'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im54cG9ua2JrZ3BqemF4YXZhbnVwIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODI0NzUzMTIsImV4cCI6MjA5ODA1MTMxMn0.Ma8YLQMDYBsWA8KG3Bo6DueduAmr0kmUuZfDFQGMBqM'\n    );\n    const sb = this._sb;\n\n    // Load categories\n    const { data: catData } = await sb.from('inventory_categories').select('name');\n    let categories = catData && catData.length ? catData.map(r => r.name) : null;\n\n    // Migrate localStorage categories if DB empty\n    if (!categories) {\n      let localCats = ['Devices','Cables','Docks','Displays','Peripherals'];\n      try { const s = localStorage.getItem('sc_it_cats_v2'); if (s) localCats = JSON.parse(s); } catch(e) {}\n      for (const name of localCats) {\n        await sb.from('inventory_categories').upsert({ name });\n      }\n      categories = localCats;\n    }\n\n    // Load items\n    this.setState({ loadingMsg: 'Syncing data…' });\n    const { data: itemData } = await sb.from('inventory_items').select('*').order('sort_order');\n    let items;\n\n    if (itemData && itemData.length > 0) {\n      items = itemData.map(r => this._fromDb(r));\n    } else {\n      // Migrate localStorage items or use defaults\n      let localItems = null;\n      try { const s = localStorage.getItem('sc_it_v3'); if (s) localItems = JSON.parse(s); } catch(e) {}\n      items = (localItems || this._DEFAULTS).map(i => ({\n        ...i,\n        category: (i.category === 'Laptops' || i.category === 'Phones') ? 'Devices' : i.category,\n      }));\n      for (let idx = 0; idx < items.length; idx++) {\n        await sb.from('inventory_items').upsert(this._toDb(items[idx], idx));\n      }\n      try { localStorage.removeItem('sc_it_v3'); localStorage.removeItem('sc_it_cats_v2'); } catch(e) {}\n    }\n\n    this.setState({ items, categories, loading: false });\n  }\n\n  async _save(items) {\n    this.setState({ items });\n  }\n\n  async _saveCats(cats) {\n    this.setState({ categories: cats });\n  }\n\n  async _sbPatch(id, patch) {\n    const map = { inStorage:'in_storage', onOrder:'on_order', waitingDeploy:'waiting_deploy', minStock:'min_stock', needToBuy:'need_to_buy', name:'name', category:'category', unit:'unit' };\n    const dbPatch = {};\n    for (const k in patch) dbPatch[map[k] || k] = patch[k];\n    await this._sb.from('inventory_items').update(dbPatch).eq('id', id);\n  }\n\n  _reorder(fromId, toId) {\n    if (fromId === toId || fromId == null) return;\n    const items = [...this.state.items];\n    const fromIdx = items.findIndex(i => i.id === fromId);\n    const toIdx   = items.findIndex(i => i.id === toId);\n    if (fromIdx === -1 || toIdx === -1) return;\n    const [moved] = items.splice(fromIdx, 1);\n    items.splice(toIdx, 0, moved);\n    this.setState({ items, dragId: null, dragOverId: null });\n    items.forEach((i, idx) => this._sb.from('inventory_items').update({ sort_order: idx }).eq('id', i.id));\n  }\n\n  _adjustField(id, field, delta) {\n    const items = this.state.items.map(i =>\n      i.id === id ? { ...i, [field]: Math.max(0, (i[field] || 0) + delta) } : i\n    );\n    this.setState({ items });\n    const it = items.find(i => i.id === id);\n    this._sbPatch(id, { [field]: it[field] });\n  }\n\n  _toggleBuy(id) {\n    const items = this.state.items.map(i => i.id === id ? { ...i, needToBuy: !i.needToBuy } : i);\n    this.setState({ items });\n    const it = items.find(i => i.id === id);\n    this._sbPatch(id, { needToBuy: it.needToBuy });\n  }\n\n  async _delete(id) {\n    if (window.confirm('Remove this item from inventory?')) {\n      this.setState({ items: this.state.items.filter(i => i.id !== id) });\n      await this._sb.from('inventory_items').delete().eq('id', id);\n    }\n  }\n\n  _openEdit(id) {\n    const it = this.state.items.find(i => i.id === id);\n    this.setState({\n      showModal: true, editId: id,\n      form: { name: it.name, category: it.category, inStorage: it.inStorage || 0, onOrder: it.onOrder || 0, waitingDeploy: it.waitingDeploy || 0, minStock: it.minStock, unit: it.unit }\n    });\n  }\n\n  renderVals() {\n    const { items, view, filter, statFilter, showModal, editId, form, loading, loadingMsg } = this.state;\n    const { categories } = this.state;\n    const PALETTE = ['#3b82f6','#a855f7','#06b6d4','#10b981','#f59e0b','#ec4899','#14b8a6','#f97316','#8b5cf6','#6366f1'];\n    const catColorFn = cat => { const i = categories.indexOf(cat); return i >= 0 ? PALETTE[i % PALETTE.length] : '#64748b'; };\n\n    const enrich = it => {\n      const inStorage = it.inStorage || 0;\n      const onOrder   = it.onOrder || 0;\n      const waitingDeploy = it.waitingDeploy || 0;\n      const spare = Math.max(0, inStorage + onOrder - waitingDeploy);\n      const sc = spare === 0 ? '#ef4444' : spare <= it.minStock ? '#f59e0b' : '#22d3ee';\n      const pct = Math.min(100, Math.round(spare / Math.max(1, it.minStock * 2) * 100));\n      const c = catColorFn(it.category);\n      return {\n        ...it, inStorage, onOrder, waitingDeploy, spare,\n        catColor: c,\n        catBg: c + '1a',\n        statusColor: sc,\n        statusLabel: spare === 0 ? 'OUT' : spare <= it.minStock ? 'LOW' : 'OK',\n        fillPct: pct + '%',\n        spareBg: spare === 0 ? 'rgba(239,68,68,0.1)' : spare <= it.minStock ? 'rgba(245,158,11,0.1)' : 'rgba(34,211,238,0.07)',\n        spareBorder: spare === 0 ? 'rgba(239,68,68,0.28)' : spare <= it.minStock ? 'rgba(245,158,11,0.25)' : 'rgba(34,211,238,0.18)',\n        buyLabel: it.needToBuy ? '★ On List' : '☆ Add to List',\n        buyBg: it.needToBuy ? 'rgba(245,158,11,0.12)' : 'transparent',\n        buyBorder: it.needToBuy ? 'rgba(245,158,11,0.35)' : '#111d33',\n        buyColor: it.needToBuy ? '#f59e0b' : '#2a3f5f',\n        onStorAdd: () => this._adjustField(it.id, 'inStorage', 1),\n        onStorSub: () => this._adjustField(it.id, 'inStorage', -1),\n        onOrdAdd:  () => this._adjustField(it.id, 'onOrder', 1),\n        onOrdSub:  () => this._adjustField(it.id, 'onOrder', -1),\n        onDepAdd:  () => this._adjustField(it.id, 'waitingDeploy', 1),\n        onDepSub:  () => this._adjustField(it.id, 'waitingDeploy', -1),\n        onToggleBuy: () => this._toggleBuy(it.id),\n        onEdit:      () => this._openEdit(it.id),\n        onDelete:    () => this._delete(it.id),\n        cardOpacity: this.state.dragId === it.id ? '0.35' : '1',\n        cardBorder:  this.state.dragOverId === it.id && this.state.dragId !== it.id ? '#2563eb' : '#111d33',\n        onDragStart: (e) => { e.dataTransfer.effectAllowed = 'move'; this.setState({ dragId: it.id }); },\n        onDragOver:  (e) => { e.preventDefault(); if (this.state.dragOverId !== it.id) this.setState({ dragOverId: it.id }); },\n        onDragEnd:   () => this.setState({ dragId: null, dragOverId: null }),\n        onDrop:      (e) => { e.preventDefault(); this._reorder(this.state.dragId, it.id); },\n      };\n    };\n\n    const isLow  = i => Math.max(0, (i.inStorage||0) + (i.onOrder||0) - (i.waitingDeploy||0)) <= i.minStock;\n    const isOnOrder = i => (i.onOrder || 0) > 0;\n    const displayItems  = items\n      .filter(i => filter === 'All' || i.category === filter)\n      .filter(i => statFilter === 'all' || (statFilter === 'low' && isLow(i)) || (statFilter === 'order' && isOnOrder(i)))\n      .map(enrich);\n    const shoppingItems = items.filter(i => i.needToBuy).map(enrich);\n    const lowCount      = items.filter(i => Math.max(0, (i.inStorage||0) + (i.onOrder||0) - (i.waitingDeploy||0)) <= i.minStock).length;\n    const onOrderTotal  = items.reduce((s, i) => s + (i.onOrder || 0), 0);\n    const isAlerted     = lowCount > 0;\n\n    return {\n      displayItems,\n      shoppingItems,\n      isInventory: view === 'inventory',\n      isShopping:  view === 'shopping',\n      totalCount: items.length,\n      lowCount,\n      onOrderTotal,\n      shoppingCount: shoppingItems.length,\n      alertColor:  isAlerted ? '#f59e0b' : '#22d3ee',\n      alertBg:     isAlerted ? 'rgba(245,158,11,0.07)' : 'rgba(34,211,238,0.05)',\n      alertBorder: statFilter === 'low' ? (isAlerted ? '#f59e0b' : '#22d3ee') : isAlerted ? 'rgba(245,158,11,0.18)' : 'rgba(34,211,238,0.12)',\n      invBg:    view === 'inventory' ? '#1a2d4a' : 'transparent',\n      invColor: view === 'inventory' ? '#60a5fa' : '#2a3f5f',\n      shopBg:    view === 'shopping' ? '#1a2d4a' : 'transparent',\n      shopColor: view === 'shopping' ? '#60a5fa' : '#2a3f5f',\n      badgeBg:    shoppingItems.length > 0 ? 'rgba(245,158,11,0.18)' : '#111d33',\n      badgeColor: shoppingItems.length > 0 ? '#f59e0b' : '#2a3f5f',\n      categoryChips: ['All', ...categories].map(cat => ({\n        label: cat,\n        bg:     filter === cat ? '#1a2d4a' : 'transparent',\n        border: filter === cat ? '#2563eb' : '#111d33',\n        color:  filter === cat ? '#60a5fa' : '#2a3f5f',\n        onClick: () => this.setState({ filter: cat, statFilter: 'all' }),\n      })),\n      showModal,\n      modalTitle: editId ? 'Edit Item' : 'Add New Item',\n      form,\n      statAllClick:   () => this.setState({ statFilter: statFilter === 'all' ? 'all' : 'all' }),\n      statLowClick:   () => this.setState({ statFilter: statFilter === 'low'   ? 'all' : 'low' }),\n      statOrderClick: () => this.setState({ statFilter: statFilter === 'order' ? 'all' : 'order' }),\n      statAllBorder:   statFilter === 'all'   ? '#2563eb' : '#111d33',\n      statOrderBorder: statFilter === 'order' ? '#60a5fa' : '#111d33',\n      setInventory: () => this.setState({ view: 'inventory' }),\n      setShopping:  () => this.setState({ view: 'shopping' }),\n      openAdd: () => this.setState({ showModal: true, editId: null, form: { name: '', category: 'Devices', inStorage: 0, onOrder: 0, waitingDeploy: 0, minStock: 2, unit: 'units' } }),\n      closeModal: () => this.setState({ showModal: false }),\n      stopProp: e => e.stopPropagation(),\n      saveItem: async () => {\n        const { form, editId, items } = this.state;\n        if (!form.name.trim()) return;\n        const n = { ...form, inStorage: Math.max(0, parseInt(form.inStorage)||0), onOrder: Math.max(0, parseInt(form.onOrder)||0), waitingDeploy: Math.max(0, parseInt(form.waitingDeploy)||0), minStock: Math.max(0, parseInt(form.minStock)||0) };\n        let newItems;\n        if (editId) {\n          newItems = items.map(i => i.id === editId ? { ...i, ...n } : i);\n          this.setState({ items: newItems, showModal: false });\n          await this._sbPatch(editId, n);\n        } else {\n          const newItem = { ...n, id: Date.now(), needToBuy: false };\n          newItems = [...items, newItem];\n          this.setState({ items: newItems, showModal: false });\n          await this._sb.from('inventory_items').insert(this._toDb(newItem, newItems.length - 1));\n        }\n      },\n      onNameChange:    e => this.setState({ form: { ...this.state.form, name: e.target.value } }),\n      onCatChange:     e => this.setState({ form: { ...this.state.form, category: e.target.value } }),\n      onStorageChange: e => this.setState({ form: { ...this.state.form, inStorage: e.target.value } }),\n      onOrderChange:   e => this.setState({ form: { ...this.state.form, onOrder: e.target.value } }),\n      onDeployChange:  e => this.setState({ form: { ...this.state.form, waitingDeploy: e.target.value } }),\n      onMinChange:     e => this.setState({ form: { ...this.state.form, minStock: e.target.value } }),\n      onUnitChange:    e => this.setState({ form: { ...this.state.form, unit: e.target.value } }),\n      categoryOptions: categories,\n      catRows: categories.map((name, idx) => ({\n        name,\n        color: PALETTE[idx % PALETTE.length],\n        count: items.filter(i => i.category === name).length,\n        onRename: async () => {\n          const newName = window.prompt('Rename category:', name);\n          if (!newName || !newName.trim() || newName.trim() === name) return;\n          const trimmed = newName.trim();\n          const newCats = this.state.categories.map(c => c === name ? trimmed : c);\n          const newItems = this.state.items.map(i => i.category === name ? { ...i, category: trimmed } : i);\n          this.setState({ categories: newCats, items: newItems, filter: this.state.filter === name ? trimmed : this.state.filter });\n          await this._sb.from('inventory_categories').delete().eq('name', name);\n          await this._sb.from('inventory_categories').insert({ name: trimmed });\n          for (const i of newItems.filter(i => i.category === trimmed)) {\n            await this._sbPatch(i.id, { category: trimmed });\n          }\n        },\n        onDelete: async () => {\n          const count = this.state.items.filter(i => i.category === name).length;\n          if (!window.confirm(count > 0 ? `\"${name}\" has ${count} item(s). Delete category anyway?` : `Delete category \"${name}\"?`)) return;\n          const newCats = this.state.categories.filter(c => c !== name);\n          this.setState({ categories: newCats, filter: this.state.filter === name ? 'All' : this.state.filter });\n          await this._sb.from('inventory_categories').delete().eq('name', name);\n        },\n      })),\n      newCatName: this.state.newCatName,\n      showCatModal: this.state.showCatModal,\n      openCatModal:  () => this.setState({ showCatModal: true }),\n      closeCatModal: () => this.setState({ showCatModal: false }),\n      addCategory: async () => {\n        const name = this.state.newCatName.trim();\n        if (!name || this.state.categories.includes(name)) return;\n        const newCats = [...this.state.categories, name];\n        this.setState({ categories: newCats, newCatName: '' });\n        await this._sb.from('inventory_categories').insert({ name });\n      },\n      onNewCatChange: e => this.setState({ newCatName: e.target.value }),\n      isLoading: loading,\n      loadingMsg,\n    };\n  }\n}\n<\u002Fscript>\n\n\n<\u002Fbody><\u002Fhtml>"
